name: Update courses

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button / "اسحب الكورسات الآن" in the dashboard
    inputs:
      debug:
        description: "Save a sample of raw messages to data/debug-messages.json"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", "data/settings.json", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # lets a run on main ask for a deploy run on the default branch

concurrency:
  group: update-courses
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always main, even when the hourly schedule starts from another default branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s scraper/tests -t .

      - name: Scrape Telegram channels
        run: python -u -m scraper.scrape
        env:
          SCRAPER_DEBUG: ${{ inputs.debug && '1' || '' }}

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/courses.json data/.cache.json
          [ -f data/debug-messages.json ] && git add data/debug-messages.json
          if ! git diff --cached --quiet; then
            git commit -m "Update courses data"
            # Settings may have been saved meanwhile; on a clash keep this run's fresh data files.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

  # GitHub Pages only accepts deploys started from the repository's default branch.
  # A run started elsewhere (e.g. a push to main from the dashboard) hands over to it.
  handover:
    needs: scrape
    # (scheduled runs always start on the default branch and carry no repository info)
    if: github.event_name != 'schedule' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Start a deploy run on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  deploy:
    needs: scrape
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # includes the data commit made by the scrape job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python -m scraper.build

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turn GitHub Pages on if it is still off
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
