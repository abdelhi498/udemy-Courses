<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كورسات مجانية | كوبونات يوديمي 100%</title>
  <meta name="description" content="أحدث كورسات يوديمي وغيرها بخصم 100% — تتحدث تلقائياً كل ساعة.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="./">🎓 <span>كورسات مجانية</span></a>
        <button id="theme" class="icon-btn" type="button" aria-label="تبديل الوضع الليلي">🌙</button>
      </div>
      <h1>كورسات مدفوعة… <em>مجاناً 100%</em></h1>
      <p class="lead">نجمع لك كوبونات يوديمي والمنصات الأخرى لحظة نزولها. الكوبونات محدودة العدد والمدة، فسارع بالتسجيل.</p>
      <div class="stats">
        <span><b id="count">—</b> كورس متاح</span>
        <span>آخر تحديث: <b id="updated">—</b></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="بحث وتصفية">
      <input id="search" type="search" placeholder="ابحث عن كورس… (Python, Excel, تصميم)" autocomplete="off">
      <select id="sort" aria-label="الترتيب">
        <option value="new">الأحدث أولاً</option>
        <option value="old">الأقدم أولاً</option>
        <option value="az">أبجدياً</option>
      </select>
      <label class="check"><input id="verified" type="checkbox"> المؤكدة فقط</label>
    </section>
    <div id="providers" class="chips" role="group" aria-label="المنصة"></div>

    <p id="message" class="message" hidden></p>
    <section id="grid" class="grid" aria-live="polite"></section>
    <div class="more"><button id="more" type="button" hidden>عرض المزيد</button></div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>الموقع لا يستضيف أي كورسات؛ كل الروابط تذهب إلى المنصات الرسمية. المصادر: قنوات تيليجرام عامة.</p>
      <p><a href="https://www.facebook.com/profile.php?id=61575779696971" target="_blank" rel="noopener">تابعنا على فيسبوك</a></p>
    </div>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <a class="thumb" target="_blank" rel="noopener"><img alt="" loading="lazy"><span class="ph"></span></a>
      <div class="body">
        <div class="meta">
          <span class="badge provider"></span>
          <span class="badge new" hidden>جديد</span>
          <span class="badge status"></span>
        </div>
        <h3 class="title"></h3>
        <p class="time"></p>
        <div class="actions">
          <a class="btn primary go" target="_blank" rel="noopener">احصل عليه مجاناً</a>
          <button class="btn copy" type="button" title="نسخ الكوبون"></button>
          <a class="btn ghost src" target="_blank" rel="noopener" title="المنشور الأصلي على تيليجرام">المصدر</a>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
