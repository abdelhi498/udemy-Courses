<!doctype html>
<html lang="ar" dir="rtl">
<head>
  {{head}}
</head>
<body data-countdown="{{seconds}}" data-per-page="{{per_page}}" data-sort="{{default_sort}}">
  {{topnav}}

  <header class="hero">
    <div class="wrap">
      <span class="eyebrow"><span class="dot"></span> {{eyebrow}}</span>
      <h1>{{tagline}}</h1>
      <p class="lead">{{lead}}</p>
      <form class="hero-search" role="search" onsubmit="return false">
        <span class="ico">🔍</span>
        <input id="search" type="search" placeholder="{{search_placeholder}}" autocomplete="off" aria-label="بحث">
        <button class="btn primary" type="submit">بحث</button>
      </form>
      <div class="stats" {{stats_hidden}}>
        <span class="stat"><b id="count">{{count}}</b> كورس مجاني الآن</span>
        <span class="stat">آخر تحديث: <b id="updated" data-iso="{{updated}}">—</b></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="تصفية" {{filters_hidden}}>
      <div id="cats" class="chips" role="group" aria-label="التصنيف" {{cats_hidden}}></div>
      <div class="filters">
        <span class="count" id="result-count"></span>
        <select id="lang" aria-label="اللغة"><option value="">🌐 كل اللغات</option></select>
        <select id="sort" aria-label="الترتيب">
          <option value="new">الأحدث أولاً</option>
          <option value="rating">الأعلى تقييماً</option>
          <option value="price">الأغلى سعراً أصلاً</option>
          <option value="az">أبجدياً</option>
        </select>
        <label class="check"><input id="verified" type="checkbox"> المؤكدة فقط</label>
      </div>
    </section>

    {{ad_header}}

    <p id="message" class="message" hidden></p>
    <section id="grid" class="grid" aria-live="polite" data-ad-every="{{in_feed_every}}">{{cards}}</section>
    <div class="more"><button id="more" type="button" hidden>عرض المزيد</button></div>

    {{ad_footer}}
  </main>

  {{footer}}
  <template id="ad-infeed">{{in_feed_template}}</template>
  {{body_end}}
</body>
</html>
